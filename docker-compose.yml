services:
  presence:
    build: .
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - chat-net
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - presence_redis_data:/data
    networks:
      - chat-net

volumes:
  presence_redis_data:

networks:
  chat-net:
    external: true
